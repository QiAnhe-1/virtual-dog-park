<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Illustration of a Beagle">
  <rect width="200" height="200" fill="#fff8e1"/>
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="50" ry="35" fill="#d2a679"/>
  <!-- Head -->
  <circle cx="100" cy="90" r="35" fill="#d2a679"/>
  <!-- Ears -->
  <ellipse cx="70" cy="95" rx="15" ry="25" fill="#8b5e3c"/>
  <ellipse cx="130" cy="95" rx="15" ry="25" fill="#8b5e3c"/>
  <!-- Face patch -->
  <circle cx="100" cy="95" r="20" fill="#fff"/>
  <!-- Eyes -->
  <circle cx="92" cy="88" r="3" fill="#333"/>
  <circle cx="108" cy="88" r="3" fill="#333"/>
  <!-- Nose -->
  <circle cx="100" cy="98" r="4" fill="#333"/>
  <!-- Tail -->
  <path d="M145 130 Q160 110 155 100" stroke="#8b5e3c" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>