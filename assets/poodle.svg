<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Illustration of a Poodle">
  <rect width="200" height="200" fill="#f3e5f5"/>
  <!-- Body puff -->
  <circle cx="100" cy="145" r="40" fill="#e1bee7"/>
  <!-- Neck -->
  <rect x="92" y="105" width="16" height="25" fill="#e1bee7"/>
  <!-- Head puff -->
  <circle cx="100" cy="80" r="32" fill="#e1bee7"/>
  <!-- Top knot -->
  <circle cx="100" cy="55" r="14" fill="#ce93d8"/>
  <!-- Ears -->
  <ellipse cx="72" cy="85" rx="12" ry="20" fill="#ce93d8"/>
  <ellipse cx="128" cy="85" rx="12" ry="20" fill="#ce93d8"/>
  <!-- Face -->
  <circle cx="100" cy="85" r="18" fill="#fce4ec"/>
  <!-- Eyes -->
  <circle cx="94" cy="82" r="3" fill="#333"/>
  <circle cx="106" cy="82" r="3" fill="#333"/>
  <!-- Nose -->
  <circle cx="100" cy="90" r="3.5" fill="#333"/>
  <!-- Legs (simplified) -->
  <rect x="80" y="170" width="8" height="20" fill="#e1bee7"/>
  <rect x="112" y="170" width="8" height="20" fill="#e1bee7"/>
  <!-- Paw puffs -->
  <circle cx="84" cy="190" r="8" fill="#ce93d8"/>
  <circle cx="116" cy="190" r="8" fill="#ce93d8"/>
</svg>