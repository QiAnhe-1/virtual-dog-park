<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Illustration of a Golden Retriever">
  <rect width="200" height="200" fill="#fffde7"/>
  <!-- Body -->
  <ellipse cx="100" cy="145" rx="55" ry="38" fill="#f0c75e"/>
  <!-- Head -->
  <circle cx="100" cy="85" r="38" fill="#f0c75e"/>
  <!-- Ears -->
  <ellipse cx="68" cy="90" rx="14" ry="22" fill="#d4a843"/>
  <ellipse cx="132" cy="90" rx="14" ry="22" fill="#d4a843"/>
  <!-- Muzzle -->
  <ellipse cx="100" cy="98" rx="18" ry="12" fill="#fceeb5"/>
  <!-- Eyes -->
  <circle cx="90" cy="82" r="3.5" fill="#333"/>
  <circle cx="110" cy="82" r="3.5" fill="#333"/>
  <!-- Nose -->
  <ellipse cx="100" cy="96" rx="5" ry="3.5" fill="#333"/>
  <!-- Smile -->
  <path d="M92 102 Q100 108 108 102" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M150 135 Q170 115 165 100" stroke="#d4a843" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>